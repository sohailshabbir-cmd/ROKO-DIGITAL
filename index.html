<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Offroad 3D Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }

        #start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a2a1a, #0d1f0d);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #start-screen h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #4caf50;
            color: #8bc34a;
        }

        #start-screen p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        #play-btn {
            padding: 18px 55px;
            font-size: 1.5rem;
            background: #4caf50;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.5);
        }

        #play-btn:hover {
            background: #66bb6a;
            transform: scale(1.08);
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.55);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            z-index: 10;
            display: none;
        }

        #speedometer {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0,0,0,0.55);
            padding: 10px 20px;
            border-radius: 12px;
            z-index: 10;
            display: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
            z-index: 200;
        }

        /* Mobile Controls UI */
        #mobile-controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            padding: 0 25px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            outline: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.92);
        }

        .accel-btn { background: rgba(76, 175, 80, 0.4); border-color: rgba(76, 175, 80, 0.7); }
        .accel-btn:active { background: rgba(76, 175, 80, 0.8); }

        .brake-btn { background: rgba(244, 67, 54, 0.4); border-color: rgba(244, 67, 54, 0.7); }
        .brake-btn:active { background: rgba(244, 67, 54, 0.8); }
    </style>
</head>
<body>
    <div id="loading">Loading 3D World...</div>

    <div id="start-screen">
        <h1>OFFROAD 3D</h1>
        <p>Drive through the wilderness</p>
        <button id="play-btn">Click to Start</button>
    </div>

    <div id="ui">
        <b>Controls</b><br>
        W / ↑ : Accelerate<br>
        S / ↓ : Brake / Reverse<br>
        A / ← : Steer Left<br>
        D / → : Steer Right
    </div>

    <div id="speedometer">0 km/h</div>

    <!-- On-screen Mobile Controls -->
    <div id="mobile-controls">
        <div class="control-group">
            <button id="btn-left" class="touch-btn">◀</button>
            <button id="btn-right" class="touch-btn">▶</button>
        </div>
        <div class="control-group">
            <button id="btn-brake" class="touch-btn brake-btn">▼</button>
            <button id="btn-accel" class="touch-btn accel-btn">▲</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ====================== BASIC SETUP ======================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 100, 280);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(60, 90, 40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 300;
        dirLight.shadow.camera.left = -120;
        dirLight.shadow.camera.right = 120;
        dirLight.shadow.camera.top = 120;
        dirLight.shadow.camera.bottom = -120;
        scene.add(dirLight);

        // ====================== TERRAIN HELPER ======================
        function getTerrainHeight(x, z) {
            let h = 0;
            h += Math.sin(x * 0.04) * Math.cos(z * 0.04) * 5;
            h += Math.sin(x * 0.11) * Math.cos(z * 0.09) * 2.5;
            h += Math.sin(x * 0.23 + z * 0.17) * 1.2;
            return h;
        }

        // ====================== TERRAIN ======================
        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(220, 220, 140, 140);
            const pos = geometry.attributes.position.array;

            for (let i = 0; i < pos.length; i += 3) {
                const x = pos[i];
                const y = pos[i + 1];
                pos[i + 2] = getTerrainHeight(x, -y);
            }
            geometry.computeVertexNormals();
            geometry.rotateX(-Math.PI / 2);

            const material = new THREE.MeshStandardMaterial({
                color: 0x5a7d3a,
                roughness: 0.92,
                metalness: 0.05
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
        }
        createTerrain();

        // Dirt patches
        for (let i = 0; i < 30; i++) {
            const geo = new THREE.CircleGeometry(3 + Math.random() * 7, 12);
            const mat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            const dx = (Math.random() - 0.5) * 180;
            const dz = (Math.random() - 0.5) * 180;
            mesh.position.set(dx, getTerrainHeight(dx, dz) + 0.05, dz);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // ====================== TREES ======================
        function createPineTree(scale = 1) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22*scale, 0.38*scale, 3.2*scale, 7),
                new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 })
            );
            trunk.position.y = 1.6 * scale;
            trunk.castShadow = true;
            tree.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x1e4d2b, roughness: 0.85, flatShading: true });
            const layers = [
                { y: 3.5*scale, r: 2.6*scale, h: 2.1*scale },
                { y: 4.9*scale, r: 1.9*scale, h: 1.7*scale },
                { y: 6.0*scale, r: 1.3*scale, h: 1.4*scale },
                { y: 6.9*scale, r: 0.75*scale, h: 1.0*scale }
            ];
            layers.forEach(l => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 7), leafMat);
                cone.position.y = l.y;
                cone.castShadow = true;
                tree.add(cone);
            });
            return tree;
        }

        function createOakTree(scale = 1) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28*scale, 0.45*scale, 2.8*scale, 7),
                new THREE.MeshStandardMaterial({ color: 0x3d2914, roughness: 0.9 })
            );
            trunk.position.y = 1.4 * scale;
            trunk.castShadow = true;
            tree.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.85 });
            const positions = [
                [0, 3.9*scale, 0, 2.3*scale],
                [-1.2*scale, 3.4*scale, 0.7*scale, 1.5*scale],
                [1.3*scale, 3.5*scale, -0.5*scale, 1.6*scale],
                [0.2*scale, 4.8*scale, 0.3*scale, 1.4*scale]
            ];
            positions.forEach(p => {
                const s = new THREE.Mesh(new THREE.SphereGeometry(p[3], 7, 6), leafMat);
                s.position.set(p[0], p[1], p[2]);
                s.castShadow = true;
                tree.add(s);
            });
            return tree;
        }

        function createDeadTree(scale = 1) {
            const tree = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 1 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18*scale, 0.32*scale, 4.2*scale, 6), mat);
            trunk.position.y = 2.1 * scale;
            trunk.castShadow = true;
            tree.add(trunk);
            return tree;
        }

        for (let i = 0; i < 70; i++) {
            let tree;
            const r = Math.random();
            if (r < 0.6) tree = createPineTree(0.75 + Math.random()*0.6);
            else if (r < 0.88) tree = createOakTree(0.7 + Math.random()*0.5);
            else tree = createDeadTree(0.8 + Math.random()*0.4);

            const x = (Math.random() - 0.5) * 190;
            const z = (Math.random() - 0.5) * 190;
            if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;

            const groundY = getTerrainHeight(x, z);
            tree.position.set(x, groundY, z);
            tree.rotation.y = Math.random() * Math.PI * 2;
            scene.add(tree);
        }

        // ====================== CAR ======================
        let car = null;

        function createDefaultCar() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.4 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 4.0), bodyMat);
            body.position.y = 0.55;
            body.castShadow = true;
            group.add(body);

            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(1.7, 0.5, 1.9),
                new THREE.MeshStandardMaterial({ color: 0x222, roughness: 0.3 })
            );
            cabin.position.set(0, 1.05, -0.25);
            cabin.castShadow = true;
            group.add(cabin);

            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.7 });
            [[-1.05,0.38,1.35],[1.05,0.38,1.35],[-1.05,0.38,-1.35],[1.05,0.38,-1.35]].forEach(p => {
                const w = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.32, 14), wheelMat);
                w.rotation.z = Math.PI/2;
                w.position.set(...p);
                w.castShadow = true;
                group.add(w);
            });
            return group;
        }

        car = createDefaultCar();
        car.position.set(0, getTerrainHeight(0, 0), 0);
        scene.add(car);

        // ====================== AUTO-FIX GLB CAR LOADER ======================
const loader = new GLTFLoader();
loader.load('car.glb', (gltf) => {
    // Purani red car ko hatao
    scene.remove(car);

    const loadedModel = gltf.scene;

    // 1. Shadows Enable Karein
    loadedModel.traverse(c => {
        if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
        }
    });

    // 2. Model ka Size aur Bounding Box Calculate Karein
    const box = new THREE.Box3().setFromObject(loadedModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    // 3. Car ko Wrapper me daal kar Pivot Fix karein (Wheels zameen par laane ke liye)
    loadedModel.position.x -= center.x;
    loadedModel.position.y -= box.min.y; // Wheels Y=0 par aayenge
    loadedModel.position.z -= center.z;

    const carWrapper = new THREE.Group();
    carWrapper.add(loadedModel);

    // 4. AUTO-SCALE: Car ka size automatically 4 units (normal car) jitna kar do
    const maxDimension = Math.max(size.x, size.y, size.z);
    if (maxDimension > 0) {
        const targetSize = 11.0; // Ideal length of car
        const scaleFactor = targetSize / maxDimension;
        carWrapper.scale.set(scaleFactor, scaleFactor, scaleFactor);
    }

    // 5. Car ko global variable me assign karein aur Terrain par rakhein
    car = carWrapper;
    const groundY = getTerrainHeight(0, 0);
    car.position.set(0, groundY + 1.0, 0);

    scene.add(car);
    console.log("✅ Custom car successfully loaded and auto-fitted!");

}, undefined, (error) => {
    console.error("❌ Car load nahi hui. Error check karein:", error);
    // Error aane par Default Red Car hi rahegi
});

        // ====================== CONTROLS & PHYSICS ======================
        const keys = {};

        // Keyboard listeners
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Touch Control Listeners
        function bindTouchControl(elementId, keyName) {
            const btn = document.getElementById(elementId);
            if (!btn) return;

            const handleStart = (e) => {
                e.preventDefault();
                keys[keyName] = true;
            };

            const handleEnd = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };

            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        }

        bindTouchControl('btn-left', 'a');
        bindTouchControl('btn-right', 'd');
        bindTouchControl('btn-accel', 'w');
        bindTouchControl('btn-brake', 's');

        let speed = 0;
        let steering = 0;
        const maxSpeed = 0.58;
        const accel = 0.013;
        const friction = 0.965;

        function updateCar(dt) {
            if (!car) return;

            const frameFactor = Math.min(dt * 60, 2);

            if (keys['w'] || keys['arrowup']) speed += accel * frameFactor;
            if (keys['s'] || keys['arrowdown']) speed -= accel * 0.75 * frameFactor;

            if (keys['a'] || keys['arrowleft']) steering = 0.038 * Math.min(Math.abs(speed)*2.5, 1);
            else if (keys['d'] || keys['arrowright']) steering = -0.038 * Math.min(Math.abs(speed)*2.5, 1);
            else steering *= 0.82;

            speed = THREE.MathUtils.clamp(speed, -maxSpeed*0.5, maxSpeed);
            speed *= Math.pow(friction, frameFactor);

            car.rotation.y += steering * Math.sign(speed || 1) * frameFactor;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quaternion);
            car.position.addScaledVector(dir, speed * frameFactor);

            const currentGroundHeight = getTerrainHeight(car.position.x, car.position.z);
            car.position.y = currentGroundHeight;

            const kmh = Math.abs(speed * 120).toFixed(0);
            document.getElementById('speedometer').textContent = kmh + " km/h";
        }

        // Camera follow
        const camOffset = new THREE.Vector3(0, 7, 13);
        function updateCamera() {
            if (!car) return;
            const target = car.position.clone().add(camOffset.clone().applyQuaternion(car.quaternion));
            camera.position.lerp(target, 0.07);
            camera.lookAt(car.position.x, car.position.y + 1.2, car.position.z);
        }

        // ====================== GAME LOOP ======================
        let isPlaying = false;
        let lastTime = 0;

        function animate(time) {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = (time - lastTime) / 1000 || 0.016;
            lastTime = time;

            updateCar(dt);
            updateCamera();
            renderer.render(scene, camera);
        }

        // ====================== START BUTTON ======================
        document.getElementById('loading').style.display = 'none';

        document.getElementById('play-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('mobile-controls').style.display = 'flex';
            isPlaying = true;
            lastTime = performance.now();
            animate(lastTime);
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
